version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: doctorin-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doctorin_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecurePassword123}
      POSTGRES_DB: ${POSTGRES_DB:-doctorin_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doctorin_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M

  redis:
    image: redis:7-alpine
    container_name: doctorin-redis-prod
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-ChangeMeSecureRedisPassword123}"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ChangeMeSecureRedisPassword123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doctorin-backend-prod
    restart: always
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-doctorin_admin}:${POSTGRES_PASSWORD:-ChangeMeSecurePassword123}@postgres:5432/${POSTGRES_DB:-doctorin_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-ChangeMeSecureRedisPassword123}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doctorin-frontend-prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://doctorin.app/api/v1
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M

  nginx:
    image: nginx:1.25-alpine
    container_name: doctorin-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_challenge:/var/www/certbot
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot:latest
    container_name: doctorin-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_challenge:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"

volumes:
  postgres_prod_data:
  redis_prod_data:
  certbot_certs:
  certbot_challenge:
